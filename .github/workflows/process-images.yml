name: Resize and watermark uploads
on:
  push:
    paths: ["images/uploads/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: process-images
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==10.4.0
      - run: python scripts/process_images.py
      - name: Save processed images
        run: |
          git config user.name "lazytale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A images content
          git diff --cached --quiet || (git commit -m "Resize and watermark new uploads" && git push)
